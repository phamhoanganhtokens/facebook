        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap');
        *{font-family:'Be Vietnam Pro',system-ui,sans-serif}
        .cinzel{font-family:'Cinzel',serif}
        @keyframes flySword{
          0%{transform:translate3d(-20vw,0,0) rotate(-18deg); opacity:0}
          8%{opacity:1}
          85%{opacity:1}
          100%{transform:translate3d(120vw,-28vh,0) rotate(8deg); opacity:0}
        }
        @keyframes craneFloat{
          0%{transform:translate3d(0,0,0) rotate(0deg)}
          25%{transform:translate3d(18vw,-12vh,0) rotate(6deg)}
          50%{transform:translate3d(32vw,4vh,0) rotate(-4deg)}
          75%{transform:translate3d(10vw,12vh,0) rotate(8deg)}
          100%{transform:translate3d(0,0,0) rotate(0deg)}
        }
        @keyframes orbit{
          0%{transform:rotate(0deg) translateX(90px) rotate(0deg)}
          100%{transform:rotate(360deg) translateX(90px) rotate(-360deg)}
        }
        @keyframes twinkle{
          0%,100%{opacity:0.2; transform:scale(0.8)}
          50%{opacity:1; transform:scale(1.4)}
        }
        @keyframes cloudDrift{
          0%{transform:translateX(-15%)}
          100%{transform:translateX(15%)}
        }
        @keyframes shimmer{
          0%{transform:translateX(-100%)}
          100%{transform:translateX(200%)}
        }
        @keyframes glowPulse{
          0%,100%{box-shadow:0 0 20px rgba(255,215,0,0.4),0 0 60px rgba(255,215,0,0.15)}
          50%{box-shadow:0 0 35px rgba(255,215,0,0.8),0 0 90px rgba(255,215,0,0.3)}
        }
        @keyframes haloRotate{
          0%{transform:rotate(0deg)}
          100%{transform:rotate(360deg)}
        }
        @keyframes rayMove{
          0%{transform:translateY(0) scaleY(1); opacity:0.3}
          50%{opacity:0.7}
          100%{transform:translateY(-20vh) scaleY(1.2); opacity:0.2}
        }
        @keyframes floatAvatar{
          0%,100%{transform:translateY(0)}
